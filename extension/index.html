<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Lets the browser paint its own furniture — form controls, scrollbars —
           to match the theme instead of always going light -->
  <meta name="color-scheme" content="light dark">
  <title>Tab Out</title>

  <!-- Runs before the first paint, so the page never flashes the wrong theme.
       It has to be a file rather than an inline script: MV3's CSP allows
       'self' and nothing else. See theme.js for why it reads localStorage
       instead of chrome.storage. -->
  <script src="theme.js"></script>

  <!-- Google Fonts: Newsreader (for headings/numbers) + DM Sans (for body text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">



  <!-- ================================================================
       HEADER — greeting on the left
       ================================================================ -->
  <header>
    <div class="header-left">
      <!-- "Good afternoon" — written by getGreeting() in app.js -->
      <h1 id="greeting"></h1>
      <!-- "Friday, April 4, 2026" — written by getDateDisplay() in app.js -->
      <div class="date" id="dateDisplay"></div>
    </div>

    <!-- Three explicit choices rather than a cycling button, so the current
         one is always visible: "follow the system" and "happens to look like
         the system right now" are different states. app.js keeps
         aria-pressed and the data-theme attribute in step. -->
    <div class="theme-switch" role="group" aria-label="Colour theme">
      <button class="theme-option" type="button" id="themeLight"
              data-action="set-theme" data-theme-choice="light"
              title="Light" aria-label="Light" aria-pressed="false">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><circle cx="12" cy="12" r="4" /><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
      <button class="theme-option" type="button" id="themeSystem"
              data-action="set-theme" data-theme-choice="system"
              title="Follow the system" aria-label="Follow the system" aria-pressed="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none" /></svg>
      </button>
      <button class="theme-option" type="button" id="themeDark"
              data-action="set-theme" data-theme-choice="dark"
              title="Dark" aria-label="Dark" aria-pressed="false">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" /></svg>
      </button>
    </div>
  </header>

  <!-- ================================================================
       TAB OUT DUPES BANNER — appears when you have extra Tab Out tabs open
       Hidden by default; app.js shows it when dupeTabOutCount > 1
       ================================================================ -->
  <div class="tab-cleanup-banner" id="tabOutDupeBanner" style="display:none">
    <div class="tab-cleanup-left">
      <div class="tab-cleanup-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
        </svg>
      </div>
      <div class="tab-cleanup-text">
        You have <strong id="tabOutDupeCount"></strong> Tab Out tabs open. Keep just this one?
      </div>
    </div>
    <button class="tab-cleanup-btn" data-action="close-tabout-dupes">Close extras</button>
  </div>

  <!-- ================================================================
       MAIN CONTENT AREA — two-column layout
       Left: open tabs, one card per Chrome tab group
       Right: saved for later checklist
       The right column only renders when it has items (JS controls this)
       ================================================================ -->
  <div class="dashboard-columns" id="dashboardColumns">

    <!-- LEFT COLUMN: Open tabs -->
    <div class="active-section" id="openTabsSection" style="display:none">
      <div class="section-header">
        <h2 id="openTabsSectionTitle">Open tabs</h2>
        <div class="section-line"></div>
        <div class="section-count" id="openTabsSectionCount"></div>
      </div>
      <div class="missions" id="openTabsMissions"></div>
    </div>

    <!-- RIGHT COLUMN: Saved for Later checklist -->
    <div class="deferred-column" id="deferredColumn" style="display:none">
      <div class="section-header">
        <h2>Saved for later</h2>
        <div class="section-line"></div>
        <div class="section-count" id="deferredCount"></div>
      </div>

      <!-- Active checklist items — injected by renderDeferredColumn() in app.js -->
      <div class="deferred-list" id="deferredList"></div>

      <!-- Empty state — shown when no active deferred tabs -->
      <div class="deferred-empty" id="deferredEmpty" style="display:none">
        Nothing saved. Living in the moment.
      </div>

      <!-- Archive section — collapsed by default -->
      <div class="deferred-archive" id="deferredArchive" style="display:none">
        <button class="archive-toggle" id="archiveToggle">
          <svg class="archive-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
          Archive
          <span class="archive-count" id="archiveCount"></span>
        </button>
        <div class="archive-body" id="archiveBody" style="display:none">
          <input type="text" class="archive-search" id="archiveSearch" placeholder="Search archived tabs...">
          <div class="archive-list" id="archiveList"></div>
        </div>
      </div>
    </div>

  </div><!-- end .dashboard-columns -->

  <!-- ================================================================
       COLLECTED TABS — a library of links you organise yourself, nested as
       deep as you like.
       The toolbar below is STATIC markup: app.js rewrites only the tree and
       the select's <option> list, never these fields — so a live-sync
       re-render can't destroy a field you're typing into mid-word.
       ================================================================ -->
  <section class="collections-section" id="collectionsSection">
    <div class="section-header">
      <h2>Collected tabs</h2>
      <div class="section-line"></div>
      <div class="section-count" id="collectionsCount"></div>
    </div>

    <!-- Two rows, not nine controls in one: the top row is what you're adding,
         the bottom row is where it goes and how you're looking at the tree. -->
    <div class="collection-bar">
      <div class="collection-bar-row">
        <select class="collection-ctl collection-kind" id="collectKindSelect" aria-label="What to add">
          <option value="link">Link</option>
          <option value="note">Note</option>
        </select>

        <!-- A textarea, not an input: notes and snippets are multi-line, and so
             is a whole list pasted in at once -->
        <textarea class="collection-ctl collection-value" id="collectUrlInput" rows="1"
                  placeholder="Paste a link, or a path…" aria-label="Link, path, note or code" spellcheck="false"></textarea>

        <input type="text" class="collection-ctl collection-name-input" id="collectNameInput"
               placeholder="Name (optional)" aria-label="Name" spellcheck="false">

        <button class="action-btn" data-action="add-collection-link">Add</button>
      </div>

      <div class="collection-bar-row is-meta">
        <!-- Labelled as a destination, not as part of the value above it, and
             it's where the folder button on any tab drops things too -->
        <label class="collection-target-label" for="collectTargetSelect">Add to</label>
        <select class="collection-ctl collection-target" id="collectTargetSelect" aria-label="Add to"></select>

        <!-- Creates inside whatever "Add to" points at, so pointing that at a
             group first is how you make a subgroup -->
        <button class="action-btn" data-action="add-collection-group"
                title="Create a group inside the current destination">New group</button>

        <span class="collection-bar-spacer"></span>

        <!-- Filtering. Static markup like the rest of the bar, so it stays
             typable through a live-sync re-render of the tree below it. -->
        <input type="search" class="collection-ctl collection-filter" id="collectionFilterInput"
               placeholder="Filter…" aria-label="Filter the collection" spellcheck="false">
        <select class="collection-ctl collection-kind" id="collectionStatusFilter" aria-label="Filter by status">
          <option value="">Any status</option>
          <option value="todo">To do</option>
          <option value="doing">Doing</option>
          <option value="done">Done</option>
          <option value="dropped">Dropped</option>
        </select>
      </div>
    </div>

    <div class="collection-tree" id="collectedTree" role="tree" aria-label="Collected tabs"></div>

    <div class="collection-empty" id="collectionsEmpty" style="display:none">
      Nothing collected yet. Paste a link above, or hit the bookmark icon on any tab.
    </div>
  </section>

  <!-- ================================================================
       FOOTER — global stats + refresh control
       ================================================================ -->
  <footer>
    <div class="footer-stats">
      <div class="stat">
        <div class="stat-num" id="statTabs">—</div>
        <div class="stat-label">Open tabs</div>
      </div>
    </div>
    <div class="last-refresh">
      <span style="color: var(--muted); font-size: 11px;"><a href="https://github.com/shengjie55555/tab-out" target="_top" style="color: var(--muted); text-decoration: underline; text-underline-offset: 2px;">Tab Out</a> by <a href="https://github.com/shengjie55555/tab-out" target="_top" style="color: var(--muted); text-decoration: underline; text-underline-offset: 2px;">shengjie.wu</a></span>
    </div>
  </footer>

</div><!-- end .container -->

<!-- ================================================================
     TOAST — floats above everything, used for action confirmations
     Hidden by default via CSS (opacity:0, translateY)
     ================================================================ -->
<div class="toast" id="toast">
  <!-- Checkmark circle icon (Heroicons outline) -->
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </svg>
  <span id="toastText"></span>
</div>

<!-- Personal config (gitignored) — an extension point for personal preferences.
     Nothing reads it at the moment: grouping now mirrors Chrome's own tab
     groups, which retired the LOCAL_LANDING_PAGE_PATTERNS and
     LOCAL_CUSTOM_GROUPS arrays that used to live here.
     If the file doesn't exist, that's fine — nothing depends on it. -->
<script src="config.local.js"></script>

<!-- Main dashboard logic — loads last so the DOM is ready -->
<script src="app.js"></script>
</body>
</html>
